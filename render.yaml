# Render Blueprint — Parking Manager Madagascar
# Dashboard Render > New > Blueprint > choisir ce dépôt GitHub.
# Crée le service web Node. La base PostgreSQL est externe (ex. Neon, gratuit) :
# son adresse est demandée à la création (DATABASE_URL).

services:
  - type: web
    name: parking-manager
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev : tsx, vite et TypeScript sont nécessaires pour compiler et démarrer
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Adresse de la base PostgreSQL (Neon : "Connection string", avec ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Clé de signature des sessions, générée par Render
      - key: SESSION_SECRET
        generateValue: true
      # Demandés à la création du Blueprint (non stockés dans le dépôt)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
